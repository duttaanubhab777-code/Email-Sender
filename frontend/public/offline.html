<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#071319" />
<title>Offline — Email Sender</title>
<style>
  :root { --bg:#f5f7f6; --panel:#fff; --line:#e3e9e7; --ink:#001e2b; --muted:#5c6c75; --brand:#00ed64; --brand-ink:#001e2b; --glow:rgba(0,237,100,.18); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#071319; --panel:#0e1e26; --line:#1d3340; --ink:#e8edeb; --muted:#8ca0ab; --glow:rgba(0,237,100,.14); }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", "Noto Sans Bengali", Roboto, sans-serif;
    background: radial-gradient(60% 50% at 50% 0%, var(--glow), transparent 70%), var(--bg);
    color: var(--ink); display:grid; place-items:center; padding:24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .card { width:min(420px,100%); background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:32px 26px; text-align:center; box-shadow:0 24px 60px rgba(0,30,43,.12); }
  .logo { width:84px; height:84px; border-radius:22px; margin:0 auto 18px; display:block; box-shadow:0 8px 24px var(--glow); }
  h1 { font-size:22px; letter-spacing:-.01em; margin-bottom:8px; }
  p { color:var(--muted); font-size:14.5px; line-height:1.6; }
  .pill { display:inline-flex; align-items:center; gap:8px; margin:18px 0 22px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); font-size:12.5px; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:#ff6b6b; animation: pulse 1.6s ease-in-out infinite; }
  .pill.ok .dot { background: var(--brand); animation:none; }
  button { width:100%; height:46px; border:0; border-radius:12px; background:var(--brand); color:var(--brand-ink); font:600 15px inherit; font-family:inherit; cursor:pointer; }
  button:active { transform: scale(.98); }
  @keyframes pulse { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none; } }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/icon-192.png" alt="Email Sender" width="84" height="84" />
    <h1>You're offline</h1>
    <p>Email Sender needs an internet connection to load your emails, keys and notifications. Check your connection and try again.</p>
    <div class="pill" id="pill"><span class="dot"></span><span id="state">No connection</span></div>
    <button id="retry" type="button">Try again</button>
  </main>
<script>
  var pill = document.getElementById("pill"), state = document.getElementById("state");
  function sync() {
    var on = navigator.onLine;
    pill.className = "pill" + (on ? " ok" : "");
    state.textContent = on ? "Back online — reloading…" : "No connection";
    if (on) setTimeout(function () { location.reload(); }, 600);
  }
  window.addEventListener("online", sync);
  window.addEventListener("offline", sync);
  document.getElementById("retry").addEventListener("click", function () { location.reload(); });
</script>
</body>
</html>
